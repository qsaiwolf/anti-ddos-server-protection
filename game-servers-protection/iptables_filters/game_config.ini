# Game Server Protection Configuration File
# -----------------------------------------
# Set ENABLE="true" or "false" to toggle protections.
# Modify PORT settings to match your specific game server.

# [SOURCE_ENGINE] (Games like CS:GO, CS 1.6, Rust, ARK, Gmod)
SOURCE_ENGINE_ENABLE="true"
SOURCE_ENGINE_PORT="27015"
# Max A2S_INFO queries allowed per IP per second (Stops Server Query Floods)
SOURCE_ENGINE_LIMIT="5"

# [MINECRAFT]
MINECRAFT_ENABLE="true"
MINECRAFT_PORT="25565"
# Limits how many concurrent connections a single IP can have to prevent fake player (bot) floods
MINECRAFT_CONNLIMIT="3"

# [SAMP_MTA] (San Andreas Multiplayer / Multi Theft Auto)
SAMP_MTA_ENABLE="true"
SAMP_MTA_PORT="7777"
# Max queries per IP per second
SAMP_MTA_LIMIT="10"

# [GENERAL] (General rate limiting for the whole server - Safeguard)
GENERAL_LIMIT_ENABLE="true"
# Max overall UDP packets an IP can send per second to any port
GENERAL_UDP_MAX="500"
