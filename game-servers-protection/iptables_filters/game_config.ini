# Game Server Protection Configuration File
# -----------------------------------------
# Set ENABLE="true" or "false" to toggle protections.
# Modify PORT settings to match your specific game server.

# [SOURCE_ENGINE] (CS:GO, CS 1.6, Rust, ARK, Gmod, Unturned)
SOURCE_ENGINE_ENABLE="true"
SOURCE_ENGINE_PORT="27015"
# Max A2S_INFO queries allowed per IP per second (Stops Server Query Floods)
SOURCE_ENGINE_LIMIT="5"

# [MINECRAFT]
MINECRAFT_ENABLE="true"
MINECRAFT_PORT="25565"
# Limits how many concurrent connections a single IP can have to prevent fake player (bot) floods
MINECRAFT_CONNLIMIT="3"

# [SAMP_MTA] (San Andreas Multiplayer / Multi Theft Auto)
SAMP_MTA_ENABLE="true"
SAMP_MTA_PORT="7777"
# Max queries per IP per second
SAMP_MTA_LIMIT="10"

# [FIVEM] (GTA V Roleplay)
FIVEM_ENABLE="true"
FIVEM_PORT="30120"
FIVEM_CONNLIMIT="5"

# [TEAMSPEAK_3]
TS3_ENABLE="true"
TS3_PORT="9987"
TS3_UDP_LIMIT="10"

# [7_DAYS_TO_DIE]
SEVEN_DAYS_ENABLE="true"
SEVEN_DAYS_PORT="26900"
SEVEN_DAYS_CONNLIMIT="5"

# [CUSTOM_PORTS]
# Add custom ports separated by spaces (e.g. "8080 9090")
CUSTOM_TCP_PORTS=""
CUSTOM_TCP_CONNLIMIT="10"
CUSTOM_UDP_PORTS=""
CUSTOM_UDP_LIMIT="50"

# [GENERAL_TCP_SYN]
# Protects against TCP SYN Floods globally for all enabled TCP game ports
GENERAL_TCP_SYN_ENABLE="true"
GENERAL_TCP_SYN_LIMIT="20"
# Use TCP SYNPROXY for ultimate protection (requires kernel support)
USE_SYNPROXY="true"

# [GENERAL_UDP] (General rate limiting for the whole server - Safeguard)
GENERAL_LIMIT_ENABLE="true"
# Max overall UDP packets an IP can send per second to any port
GENERAL_UDP_MAX="500"

# [IPV6_SUPPORT]
# Set to "true" if your game server listens on IPv6 and you want to apply similar ip6tables rules.
ENABLE_IPV6="true"

# [WHITELIST]
# Add trusted IPs separated by space to bypass XDP limits (e.g. "1.1.1.1 2.2.2.2")
WHITELIST_IPS=""
# IPv6 whitelist
WHITELIST_IPS_V6=""
